<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico" type="image/x-icon" />
<title>Crypto</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; color: #e8eaf0; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; padding: 12px; box-sizing: border-box; gap: 12px; }

  /* Top ticker (custom, so speed is fully controllable) */
  .ticker { overflow: hidden; flex-shrink: 0; border-top: 1px solid #222733; border-bottom: 1px solid #222733; padding: 10px 0; }
  .track { display: inline-flex; white-space: nowrap; animation: scroll 120s linear infinite; will-change: transform; }
  .ticker:hover .track { animation-play-state: paused; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .coin { display: inline-flex; align-items: center; gap: 10px; padding: 0 28px; font-size: 22px; border-right: 1px solid #222733; }
  .coin img { width: 30px; height: 30px; border-radius: 50%; }
  .coin .sym { color: #8b93a7; font-size: 16px; text-transform: uppercase; }
  .up { color: #2ecc71; } .down { color: #ff4d5e; }
  .msg { padding: 0 28px; color: #8b93a7; font-size: 18px; }

  .main { flex: 1; display: flex; gap: 12px; min-height: 0; }
  .sidebar { width: 340px; flex-shrink: 0; overflow-y: auto; border-radius: 12px; }
  .charts { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 1fr 1fr 1fr; gap: 12px; min-width: 0; }
  .card { border: 1px solid #222733; border-radius: 12px; overflow: hidden; min-height: 220px; min-width: 0; width: 100%; box-sizing: border-box; }
  .tradingview-widget-container, .tradingview-widget-container__widget { height: 100%; width: 100%; }
  @media (max-width: 900px) {
    body { height: auto; }
    .main { flex-direction: column; }
    .sidebar { width: 100%; max-height: 420px; }
    .card { height: 360px; }
  }
</style>
</head>
<body>

<!-- Top ticker: ATOM + ZRO + MORPHO first, then top coins -->
<div class="ticker"><div class="track" id="track"><span class="msg">Loading prices…</span></div></div>

<div class="main">
  <!-- Left: list of top coins -->
  <div class="sidebar">
    <script src="https://widgets.coingecko.com/gecko-coin-list-widget.js"></script>
    <gecko-coin-list-widget locale="en" dark-mode="true" outlined="true" initial-currency="usd"></gecko-coin-list-widget>
  </div>

  <!-- Right: ATOM, ZRO and MORPHO charts (hover for exact price) -->
  <div class="charts">
    <div class="card">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js" async>
        {
          "symbols": [["Cosmos", "BINANCE:ATOMUSDT|1D"]],
          "chartOnly": false, "width": "100%", "height": "100%", "locale": "en",
          "colorTheme": "dark", "autosize": true, "showVolume": false,
          "showMA": false, "hideDateRanges": false, "scalePosition": "right",
          "scaleMode": "Normal", "fontSize": "10", "noTimeScale": false,
          "valuesTracking": "1", "chartType": "area", "isTransparent": true
        }
        </script>
      </div>
    </div>
    <div class="card">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js" async>
        {
          "symbols": [["LayerZero", "BINANCE:ZROUSDT|1D"]],
          "chartOnly": false, "width": "100%", "height": "100%", "locale": "en",
          "colorTheme": "dark", "autosize": true, "showVolume": false,
          "showMA": false, "hideDateRanges": false, "scalePosition": "right",
          "scaleMode": "Normal", "fontSize": "10", "noTimeScale": false,
          "valuesTracking": "1", "chartType": "area", "isTransparent": true
        }
        </script>
      </div>
    </div>
    <div class="card">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js" async>
        {
          "symbols": [["Morpho", "COINBASE:MORPHOUSD|1D"]],
          "chartOnly": false, "width": "100%", "height": "100%", "locale": "en",
          "colorTheme": "dark", "autosize": true, "showVolume": false,
          "showMA": false, "hideDateRanges": false, "scalePosition": "right",
          "scaleMode": "Normal", "fontSize": "10", "noTimeScale": false,
          "valuesTracking": "1", "chartType": "area", "isTransparent": true
        }
        </script>
      </div>
    </div>
  </div>
</div>

<script>
  // ---- SETTINGS ----
  // Ticker speed in pixels per second. Lower = slower. (20 is slow, 10 is very slow, 50 is fast)
  const TICKER_PX_PER_SEC = 20;
  // Coins in the ticker (CoinGecko ids). ATOM, ZRO and MORPHO come first.
  const IDS = ["cosmos","layerzero","morpho","bitcoin","ethereum","tether","binancecoin","solana","ripple","usd-coin","dogecoin","cardano","tron","avalanche-2","chainlink","shiba-inu","polkadot","the-open-network","litecoin","bitcoin-cash","near","uniswap"];
  // ------------------

  const track = document.getElementById('track');

  function fmt(p) {
    if (p >= 1) return p.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    return p.toPrecision(4);
  }

  function itemsHtml(coins) {
    return coins.map(c => {
      const ch = c.price_change_percentage_24h || 0;
      const cls = ch >= 0 ? 'up' : 'down';
      return `<span class="coin"><img src="${c.image}" alt=""><b>${c.name}</b><span class="sym">${c.symbol}</span><span>$${fmt(c.current_price)}</span><span class="${cls}">${ch >= 0 ? '▲' : '▼'}${Math.abs(ch).toFixed(1)}%</span></span>`;
    }).join('');
  }

  const MINUTE = 60000;
  const cacheKey = 'prices-v1:' + IDS.join(',');
  let state = {};
  try { state = JSON.parse(localStorage.getItem(cacheKey)) || {}; } catch {}
  state.cooldowns ||= {};
  if (!state.source && !state.cooldowns.CoinGecko) state.next = Math.min(state.next || 0, (state.updated || 0) + MINUTE);
  let timer;
  let loading = false;

  function render() {
    const coins = Array.isArray(state.coins) ? state.coins : [];
    const retry = new Date(state.next).toLocaleTimeString();
    const message = state.failed ? 'Price update delayed. Next attempt at ' + retry + '.' : '';
    if (!coins.length) {
      track.textContent = message || 'Loading prices…';
      track.style.animation = 'none';
      return;
    }
    const label = message ? '<span class="msg">' + message + '</span>' : '';
    const html = label + itemsHtml(coins);
    track.innerHTML = html + html;
    track.style.animation = '';
    track.style.animationDuration = (track.scrollWidth / 2 / TICKER_PX_PER_SEC) + 's';
  }

  const paprikaIds = {
    bitcoin: 'btc-bitcoin', ethereum: 'eth-ethereum', tether: 'usdt-tether',
    binancecoin: 'bnb-binance-coin', solana: 'sol-solana', ripple: 'xrp-xrp',
    'usd-coin': 'usdc-usd-coin', dogecoin: 'doge-dogecoin', cardano: 'ada-cardano',
    tron: 'trx-tron', 'avalanche-2': 'avax-avalanche', 'shiba-inu': 'shib-shiba-inu',
    polkadot: 'dot-polkadot', 'the-open-network': 'ton-tontoken', litecoin: 'ltc-litecoin',
    'bitcoin-cash': 'bch-bitcoin-cash', near: 'near-near-protocol', uniswap: 'uni-uniswap',
    chainlink: 'link-chainlink', 'quant-network': 'qnt-quant', thorchain: 'rune-thorchain',
    cosmos: 'atom-cosmos', layerzero: 'zro-layerzero', morpho: 'morpho-morpho'
  };

  async function getPrices(source) {
    const primary = source === 'CoinGecko';
    const url = primary
      ? 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&per_page=250&ids=' + IDS.join(',')
      : 'https://api.coinpaprika.com/v1/tickers';
    const res = await fetch(url, { signal: AbortSignal.timeout(15000) });
    if (!res.ok) {
      if (res.status === 429) {
        const value = res.headers.get('Retry-After');
        const deadline = /^\d+$/.test(value) ? Date.now() + Number(value) * 1000 : Date.parse(value);
        state.cooldowns[source] = Math.max(Date.now() + MINUTE, deadline || Date.now() + 5 * MINUTE);
      }
      throw new Error('HTTP ' + res.status);
    }
    const rows = new Map((await res.json()).map(row => [row.id, row]));
    const coins = IDS.map(id => {
      if (primary) return rows.get(id);
      const coin = rows.get(paprikaIds[id]);
      if (!coin) return;
      const quote = coin.quotes?.USD;
      return { id, name: coin.name, symbol: coin.symbol, current_price: quote?.price,
        price_change_percentage_24h: quote?.percent_change_24h,
        image: 'https://static.coinpaprika.com/coin/' + paprikaIds[id] + '/logo.png' };
    }).filter(coin => Number.isFinite(coin?.current_price));
    if (!coins.length) throw new Error('No prices returned');
    return coins;
  }

  async function refresh() {
    clearTimeout(timer);
    if (document.hidden || loading) return;
    if (state.next > Date.now()) {
      timer = setTimeout(refresh, Math.min(state.next - Date.now(), 2147483647));
      return;
    }
    loading = true;
    state.failed = true;
    for (const source of ['CoinGecko', 'CoinPaprika']) {
      if (state.cooldowns[source] > Date.now()) continue;
      try {
        state.coins = await getPrices(source);
        state.source = source;
        state.updated = Date.now();
        state.failed = false;
        break;
      } catch (error) {
        console.warn(source + ' ticker update failed', error.message);
      }
    }
    state.next = Date.now() + MINUTE;
    loading = false;
    try { localStorage.setItem(cacheKey, JSON.stringify(state)); } catch {}
    render();
    timer = setTimeout(refresh, Math.max(0, Math.min(state.next - Date.now(), 2147483647)));
  }

  document.addEventListener('visibilitychange', refresh);
  render();
  refresh();
</script>

</body>
</html>
