<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico" type="image/x-icon" />
<title>Crypto</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; color: #e8eaf0; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; padding: 12px; box-sizing: border-box; gap: 12px; }

  /* Top ticker (custom, so speed is fully controllable) */
  .ticker { overflow: hidden; flex-shrink: 0; border-top: 1px solid #222733; border-bottom: 1px solid #222733; padding: 10px 0; }
  .track { display: inline-flex; white-space: nowrap; animation: scroll 120s linear infinite; will-change: transform; }
  .ticker:hover .track { animation-play-state: paused; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .coin { display: inline-flex; align-items: center; gap: 10px; padding: 0 28px; font-size: 22px; border-right: 1px solid #222733; }
  .coin img { width: 30px; height: 30px; border-radius: 50%; }
  .coin .sym { color: #8b93a7; font-size: 16px; text-transform: uppercase; }
  .up { color: #2ecc71; } .down { color: #ff4d5e; }
  .msg { padding: 0 28px; color: #8b93a7; font-size: 18px; }

  .main { flex: 1; display: flex; gap: 12px; min-height: 0; }
  .sidebar { width: 340px; flex-shrink: 0; overflow-y: auto; border-radius: 12px; }
  .charts { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 1fr 1fr; gap: 12px; min-width: 0; }
  .card { border-radius: 12px; overflow: hidden; min-height: 260px; min-width: 0; width: 100%; box-sizing: border-box; }
  .tradingview-widget-container, .tradingview-widget-container__widget { height: 100%; width: 100%; }
  @media (max-width: 900px) {
    body { height: auto; }
    .main { flex-direction: column; }
    .sidebar { width: 100%; max-height: 420px; }
    .card { height: 360px; }
  }
</style>
</head>
<body>

<!-- Top ticker: ATOM + ZRO first, then top coins -->
<div class="ticker"><div class="track" id="track"><span class="msg">Loading prices…</span></div></div>

<div class="main">
  <!-- Left: list of top coins -->
  <div class="sidebar">
    <script src="https://widgets.coingecko.com/gecko-coin-list-widget.js"></script>
    <gecko-coin-list-widget locale="en" dark-mode="true" outlined="true" initial-currency="usd"></gecko-coin-list-widget>
  </div>

  <!-- Right: ATOM and ZRO charts (hover for exact price) -->
  <div class="charts">
    <div class="card">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js" async>
        {
          "symbols": [["Cosmos", "BINANCE:ATOMUSDT|1M"]],
          "chartOnly": false, "width": "100%", "height": "100%", "locale": "en",
          "colorTheme": "dark", "autosize": true, "showVolume": false,
          "showMA": false, "hideDateRanges": false, "scalePosition": "right",
          "scaleMode": "Normal", "fontSize": "10", "noTimeScale": false,
          "valuesTracking": "1", "chartType": "area", "isTransparent": true
        }
        </script>
      </div>
    </div>
    <div class="card">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js" async>
        {
          "symbols": [["LayerZero", "BINANCE:ZROUSDT|1M"]],
          "chartOnly": false, "width": "100%", "height": "100%", "locale": "en",
          "colorTheme": "dark", "autosize": true, "showVolume": false,
          "showMA": false, "hideDateRanges": false, "scalePosition": "right",
          "scaleMode": "Normal", "fontSize": "10", "noTimeScale": false,
          "valuesTracking": "1", "chartType": "area", "isTransparent": true
        }
        </script>
      </div>
    </div>
  </div>
</div>

<script>
  // ---- SETTINGS ----
  // Ticker speed in pixels per second. Lower = slower. (20 is slow, 10 is very slow, 50 is fast)
  const TICKER_PX_PER_SEC = 20;
  // Coins in the ticker (CoinGecko ids). ATOM and ZRO come first.
  const IDS = ["cosmos","layerzero","bitcoin","ethereum","tether","binancecoin","solana","ripple","usd-coin","dogecoin","cardano","tron","avalanche-2","chainlink","shiba-inu","polkadot","the-open-network","litecoin","bitcoin-cash","near","uniswap"];
  // ------------------

  const track = document.getElementById('track');
  let started = false;

  function fmt(p) {
    if (p >= 1) return p.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    return p.toPrecision(4);
  }

  function itemsHtml(coins) {
    return coins.map(c => {
      const ch = c.price_change_percentage_24h || 0;
      const cls = ch >= 0 ? 'up' : 'down';
      return `<span class="coin"><img src="${c.image}" alt=""><b>${c.name}</b><span class="sym">${c.symbol}</span><span>$${fmt(c.current_price)}</span><span class="${cls}">${ch >= 0 ? '▲' : '▼'}${Math.abs(ch).toFixed(1)}%</span></span>`;
    }).join('');
  }

  async function load() {
    try {
      const url = 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&per_page=250&ids=' + IDS.join(',');
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      const coins = IDS.map(id => data.find(c => c.id === id)).filter(Boolean);
      if (!coins.length) throw new Error('empty');
      const html = itemsHtml(coins);
      track.innerHTML = html + html;   // doubled for a seamless loop
      if (!started) {
        started = true;
        const half = track.scrollWidth / 2;
        track.style.animationDuration = (half / TICKER_PX_PER_SEC) + 's';
      }
    } catch (e) {
      if (!started) track.innerHTML = '<span class="msg">Prices unavailable right now, retrying…</span>';
    }
  }

  load();
  setInterval(load, 60000);
</script>

</body>
</html>
